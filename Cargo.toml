[package]
name = "gcob"
version = "0.3.2"
edition = "2021"
description = "Lightweight gRPC API for Core Lightning nodes"
license = "MIT OR Apache-2.0"

[dependencies]
tonic = { version = "0.14.2", features = ["transport", "server", "_tls-any"] }
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1"
redis = { version = "1.0.2", features = ["tokio-comp", "aio", "connection-manager"] }
hex = "0.4.3"
tonic-prost = "0.14.2"
tower = "0.5.3"
rustls = "0.23.35"
anyhow = "1.0.100"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
hyper-util = "0.1.17"
http = "1.4.0"
http-body = "1.0"
http-body-util = "0.1"
bytes = "1.9.0"
tower-http = { version = "0.6.7", features = ["trace"]}
hyper = "1.8.1"
dotenvy = "0.15.7"
rand = "0.8"
sha2 = "0.10"
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
tonic-prost = "0.14.2"
