# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Validated against cargo-deny 0.20.2, the version pinned by the CI action.

[graph]
# gcob runs on Linux servers; other targets only add platform-only deps.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Unsound crates are denied everywhere; unmaintained ones only when they are
# direct/workspace dependencies. Yanked crates default to deny.
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
# Duplicate versions are reported, not fatal; wildcards and known-risky
# crates fail the build.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "git2", use-instead = "gix" },
    "libssh2-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Permissive licenses only. Crates with a disjunctive expression pass when at
# least one alternative is allowed (e.g. "MIT OR Apache-2.0 OR LGPL-2.1").
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []
